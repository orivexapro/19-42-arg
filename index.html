<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101827" />
  <title>19:41 — Archives Marianne</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="puzzles.css" />
  <link rel="stylesheet" href="enhancements.css" />
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p>Session d’archive · 2049</p>
    <div class="spinner"></div>
  </div>

  <main id="desktop" class="desktop hidden" aria-label="Bureau reconstitué">
    <div class="desktop-grain"></div>
    <section class="desktop-icons" aria-label="Icônes du bureau">
      <button class="desktop-icon" data-open="explorer" data-path="pc"><span class="icon-svg pc-icon">▣</span><span>Ce PC</span></button>
      <button class="desktop-icon" data-open="notepad"><span class="icon-svg note-icon">▤</span><span>Pense-bête</span></button>
      <button class="desktop-icon" data-open="briefing"><span class="icon-svg folder-icon">◆</span><span>Dossier Marianne</span></button>
      <button class="desktop-icon" data-open="trash"><span class="icon-svg trash-icon">♲</span><span>Corbeille</span></button>
    </section>

    <section id="window-layer" class="window-layer" aria-live="polite"></section>
    <aside id="narrator-root" class="narrator-root" aria-live="polite"></aside>

    <div id="start-menu" class="start-menu" aria-hidden="true">
      <div class="start-search">⌕&nbsp;&nbsp; Tapez ici pour rechercher</div>
      <div class="start-title"><strong>Épinglé</strong><span>Toutes les applications ›</span></div>
      <div class="start-apps">
        <button data-open="explorer" data-path="pc"><b>▣</b><span>Explorateur</span></button>
        <button data-open="notepad"><b>▤</b><span>Pense-bête</span></button>
        <button data-open="calculator"><b>＋</b><span>Calculatrice</span></button>
        <button data-open="briefing"><b>◆</b><span>Dossier</span></button>
        <button data-open="history"><b>◷</b><span>Transmissions</span></button>
        <button data-open="about"><b>ⓘ</b><span>À propos</span></button>
      </div>
      <div class="recommended">
        <strong>Nos recommandations</strong>
        <button data-open="briefing"><span class="mini-file">W</span><span><b>POINT_DE_DEPART.docx</b><small>Ajouté aujourd’hui</small></span></button>
      </div>
      <div class="start-footer"><span><i class="avatar">A</i> A. Morel</span><button id="power-button" title="Arrêter">⏻</button></div>
    </div>

    <div id="power-menu" class="power-menu hidden">
      <button id="shutdown">⏻&nbsp;&nbsp; Arrêter</button>
      <small>La session sera sauvegardée</small>
    </div>

    <footer class="taskbar">
      <div class="weather"><span>☁</span><span><b>12°C</b><small>Pluie faible</small></span></div>
      <div class="taskbar-center">
        <button id="start-button" aria-label="Démarrer"><span class="windows-logo"><i></i><i></i><i></i><i></i></span></button>
        <button class="task-icon" data-open="explorer" data-path="pc" title="Explorateur">▰</button>
        <button class="task-icon" data-open="notepad" title="Pense-bête">▤</button>
        <button class="task-icon" data-open="calculator" title="Calculatrice">＋</button>
        <span id="running-apps" class="running-apps" aria-label="Applications ouvertes"></span>
      </div>
      <div class="tray"><button id="narrator-toggle" class="narrator-toggle" title="Voix intérieure" aria-label="Activer ou couper la voix intérieure">🔊</button><span>⌃</span><span>◉</span><span>⌁</span><span id="clock"><b>19:41</b><small>17/10/2049</small></span></div>
    </footer>
  </main>

  <section id="shutdown-screen" class="shutdown-screen hidden">
    <div><span>19:41</span><p>Session sauvegardée</p><button id="restart">Rallumer le PC</button></div>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
